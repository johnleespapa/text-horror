<button class="sm" onclick="if(confirm('처음부터 다시 할까요?'))newGame()">처음부터 다시</button>
<details><summary>도움말</summary>방향 버튼이나 방향키/WASD로 한 칸씩 이동합니다. 장소에 들어서면 사건이 일어날 수 있습니다. 판정은 d20 + 보정 ≥ 난이도(DC)이면 성공. 힘 = 공격력 기반, 정신 = 이성 기반, 관찰 = 단서·손전등 기반. 이성이 낮아지면 글자가 일그러지고 환각 선택지가 섞입니다(붉은 글씨). 턴 70이 되면 만조입니다.</details>
</div>
<script>
const W=5,H=5,MAXT=70;
const END={
 truth:["썰물","노래를 거꾸로 불러 구멍을 닫고, 수아와 함께 아침을 맞았다. 바다는 다시 평범한 바다가 되었다. 진실 엔딩."],
 half:["반쪽의 바다","구멍은 닫혔다. 하지만 수아는 벽 안쪽에 남았다. 매년 그 날, 방파제에 그녀의 모양이 젖어 있다."],
 sacrifice:["대신 들어간 자리","당신은 수아를 밀어내고 그 구멍에 몸을 맞췄다. 꼭 맞았다. 처음부터 당신 자리였던 것처럼."],
 twoescape:["둘만의 새벽","수아를 끌어내 도망쳤다. 해월동은 그 해 겨울 지도에서 사라졌다. 수아는 지금도 벽에 등을 대고 잔다."],
 alone:["막차","당신은 막차를 탔다. 창밖의 해월동이 멀어진다. 휴대폰에 수아의 문자가 온다. '오빠 어디 가?'"],
 mina:["작은 손","미나의 손을 잡고 막차를 탔다. 진실은 바다에 두고 왔지만, 적어도 한 아이는 구했다."],
 caller:["부르는 자","당신은 대답했다. 이제 당신이 부른다. 밤마다, 누군가의 이름을, 아주 다정하게."],
 spiral:["나선의 눈","이성이 바닥났다. 당신은 경로당 노인들 사이에 앉아 벽을 본다. 벽도 당신을 본다."],
 shape:["내 모양의 구멍","당신은 당신 모양의 구멍을 찾았다. 들어가지 않을 이유가 하나도 떠오르지 않았다."],
 dead:["차가운 바닥","몸이 버티지 못했다. 해월동의 습기가 당신을 천천히 덮었다."],
 drown:["깊은 물","수아를 붙잡은 손이 미끄러졌다. 검은 물이 당신 둘을 안쪽으로 끌어당겼다."],
 betray:["배신의 대가","박 씨가 동굴 어둠 속에서 나타났다. '열쇠 도둑은 바다에 바친다.' 등 뒤에서 차가운 손."],
 tide:["만조","시간이 다 됐다. 바다가 일어서고, 해월동 전체가 하나의 커다란 구멍 속으로 기울었다."]
};
const CLUE={tide:"조수표: 만조에 방파제 동굴의 '큰 구멍'이 열린다.",rec:"1972년 교회 기록: 같은 실종 사건. '노래를 거꾸로 부르면 닫힌다.'",diary:"수아의 일기: '벽에 내 모양이 생겼어. 동굴에서 불러.'",song:"부름의 노래: 노인들이 부르는 노래. 거꾸로 외워 두었다.",sea:"옥상에서 본 바다: 바다 밑에 거대한 나선형 구멍이 있다."};
let S;
const $=id=>document.getElementById(id);
const r20=()=>1+Math.floor(Math.random()*20);
const has=i=>S.items.includes(i), cl=c=>S.clues.includes(c);
function mod(st){ if(st=="힘")return S.atk-2+(S.flags.wetTrust?0:0);
 if(st=="정신")return Math.floor(S.san/25)-1+(has("부적")?2:0)+(has("나선 조개")?2:0);
 return Math.floor(S.clues.length/2)+(has("손전등")?2:0);}
function check(st,dc,bonus=0){const r=r20(),m=mod(st)+bonus,ok=r==20||(r!=1&&r+m>=dc);
 return {ok,txt:`[${st} 판정] d20=${r} ${m>=0?"+":""}${m} = ${r+m} vs DC ${dc} → ${ok?"성공":"실패"}`};}
function addItem(i){if(!has(i))S.items.push(i);if(i=="쇠파이프")S.atk+=2;}
function addClue(c){if(!cl(c)){S.clues.push(c);return "\n(단서 획득)";}return "";}
function quirk(q){if(!S.quirks.includes(q)){S.quirks.push(q);if(q=="구멍난 손")S.atk--;return `\n(증상 획득: ${q})`;}return "";}
function dmg(h,s){S.hp=Math.min(S.maxhp,S.hp-h);S.san=Math.max(0,Math.min(100,S.san-s));let t="";if(h>0)t+=` HP -${h}`;if(h<0)t+=` HP +${-h}`;if(s>0)t+=` 이성 -${s}`;if(s<0)t+=` 이성 +${-s}`;return t?"\n("+t.trim()+")":"";}
// map
const G={
"0,0":["등대","녹슨 등대. 불은 꺼졌는데 렌즈가 천천히 돈다.",'sea'],
"1,0":["해변","모래 위에 사람 모양 구멍이 수십 개. 모두 바다를 향해 누운 자세다.",'sea'],
"2,0":["방파제","콘크리트 벽에 사람 모양 구멍이 빼곡하다. 키도, 어깨 폭도 제각각. 바람이 구멍을 지날 때 누군가 이름을 부르는 소리가 난다.",'sea'],
"3,0":["동굴 입구","방파제 끝, 쇠사슬로 막힌 동굴. 안에서 낮게 웅웅대는 소리.",'sea'],
"0,1":["어시장","좌판의 생선들이 모두 입을 벌리고 있다. 상인들의 눈동자가 비늘처럼 번들거린다.",'town'],
"1,1":["골목","좁은 골목. 담벼락마다 분필로 그린 동그라미.",'town'],
"2,1":["놀이터","그네가 바람도 없이 흔들린다. 미끄럼틀 아래에 무언가 웅크리고 있다.",'town'],
"3,1":["지하주차장","차 안에 사람들이 앉아 있다. 모두 운전석 옆 창문, 벽 쪽을 보고 있다.",'bld'],
"0,2":["교회","문 닫은 작은 교회. 십자가 대신 동그란 자국이 남아 있다.",'town'],
"1,2":["버스정류장","당신이 내린 곳. 시간표에 '막차 23:40'. 수아가 사라진 지 사흘째.",'town'],
"2,2":["101동 로비","우편함이 전부 열려 있다. 편지 대신 젖은 모래가 차 있다.",'bld'],
"3,2":["101동 계단","계단 벽에 손자국이 위로, 위로 이어진다. 층수 표시가 가끔 하나씩 빠진다.",'bld'],
"4,2":["옥상","해월동과 바다가 한눈에 보인다.",'bld'],
"0,3":["슈퍼","주인 없는 슈퍼. 계산대 위에 '무서우면 가져가세요'.",'town'],
"1,3":["관리사무소","관리인 박 씨가 라디오 잡음을 듣고 있다.",'bld'],
"2,3":["102동 로비","엘리베이터가 '5'에 멈춰 있다. 버튼을 누르지 않았는데 문이 열렸다 닫힌다.",'bld'],
"3,3":["수아의 집 503호","동생 수아의 원룸. 문이 열려 있다.",'bld'],
"1,4":["공중전화","낡은 공중전화 부스. 수화기가 내려진 채 흔들린다.",'town'],
"2,4":["경로당","노인들이 벽을 향해 일렬로 앉아 낮게 노래한다.",'town'],
"3,4":["보일러실","뜨겁고 습하다. 배관 사이 벽에 커다란 구멍.",'bld']};
const ABBR={"등대":"등","해변":"해","방파제":"방","동굴 입구":"굴","어시장":"시","골목":"골","놀이터":"놀","지하주차장":"주","교회":"교","버스정류장":"정","101동 로비":"1로","101동 계단":"계","옥상":"옥","슈퍼":"슈","관리사무소":"관","102동 로비":"2로","수아의 집 503호":"집","공중전화":"전","경로당":"경","보일러실":"보"};
// fixed story events: return event or null
function story(k){const f=S.flags,v=f["seen_"+k];
 const E=(t,c)=>({t,c});
 switch(k){
 case "1,2": if(S.turn>=8)return E("막차가 들어온다. 운전기사는 고개를 돌리지 않는다.",[
   {t:"이대로 탄다 (탈출)",go:()=>end(f.mina?"mina":"alone")},{t:"아직 떠날 수 없다",go:()=>"버스가 떠난다. 다음 막차는 내일이다... 아마도."}]);break;
 case "0,0": if(!v)return E("등대지기의 책상 위에 젖은 노트가 펼쳐져 있다.",[
   {t:"노트를 읽는다",go:()=>"조수 시간이 빼곡하다. 맨 아래, 붉은 글씨: '만조. 큰 구멍 열림. 듣지 말 것.'"+addClue("tide")+dmg(0,5)}]);break;
 case "2,0": if(!f.shape&&S.clues.length>=2)return E("벽의 구멍 하나가 이상하게 익숙하다. 어깨의 기울기, 왼손 약지의 굽은 각도. 당신의 모양이다.",[
   {t:"구멍에 손을 넣어 본다",ck:["정신",13],ok:()=>{f.shape=1;return "손이 꼭 맞는다. 겨우 손을 뺐다. 안쪽에서 누군가 아쉬워했다."+dmg(0,10)},no:()=>{f.shape=1;return "몸이 반쯤 들어갔다가 겨우 빠져나왔다. 피부에 콘크리트 결이 찍혀 있다."+dmg(2,20)+quirk("구멍의 기억")}},
   {t:"시멘트 조각으로 구멍을 메운다",go:()=>{f.shape=1;f.sealed=(f.sealed||0)+1;return "손이 떨렸지만 메웠다. 벽 안쪽에서 긁는 소리가 났다."+dmg(0,8)}},
   {t:"보지 않은 척 지나간다",go:()=>{f.shape=1;return "등 뒤에서 구멍이 당신을 부르는 소리가 들렸다."+dmg(0,4)}}]);break;
 case "3,0": return cave();
 case "2,1": if(!v)return E("미끄럼틀 아래, 열 살쯤 된 여자아이가 귀를 막고 있다. '엄마가 벽으로 들어갔어요. 저도 불러요.'",[
   {t:"'같이 가자.' 데려간다",go:()=>{f.mina=1;return "미나가 당신 옷자락을 꽉 잡는다. 아이는 노래를 싫어한다."}},
   {t:"관리사무소에 가 있으라고 한다",go:()=>{f.minaPark=1;return "미나가 고개를 끄덕이고 달려간다."}},
   {t:"못 본 척한다",go:()=>{f.minaLeft=1;return "뒤에서 아이가 콧노래를 시작했다. 아까 그 노래였다."+dmg(0,6)}}]);break;
 case "3,1": if(!has("쇠파이프"))return E("기둥 옆에 쇠파이프가 떨어져 있다. 가장 가까운 차 안의 남자가 천천히 고개를 돌린다.",[
   {t:"파이프를 집고 물러선다",ck:["관찰",10],ok:()=>{addItem("쇠파이프");return "파이프를 챙겼다. 남자는 다시 벽을 본다. (공격력 +2)"},no:()=>{addItem("쇠파이프");return "남자가 문을 열고 나와 당신 팔을 문다. 이빨 자국이 동그랗다. (공격력 +2)"+dmg(2,6)}},
   {t:"그냥 나간다",go:()=>"남자의 시선이 등에 닿는다."}]);break;
 case "0,2": if(!v)return E("제단 아래 서랍. 1972년 주보와 부적 하나.",[
   {t:"기록을 읽는다",go:()=>{addItem("부적");return "'해월동 주민 열세 명 실종. 벽에 그들의 모양. 신부님이 노래를 거꾸로 불러 닫다.' 부적도 챙겼다. (정신 판정 +2)"+addClue("rec")}}]);break;
 case "4,2": if(!cl("sea"))return E("바다를 내려다본다. 수면 아래 무언가 거대하다.",[
   {t:"끝까지 본다",ck:["정신",11],ok:()=>"바다 밑에 마을만 한 나선형 구멍. 해월동 전체가 그 가장자리다."+addClue("sea")+dmg(0,8),no:()=>"나선이 눈 안으로 감겨 들어온다. 한참 뒤 정신을 차렸다."+addClue("sea")+dmg(0,18)+quirk("나선 잔상")},
   {t:"눈을 돌린다",go:()=>"보지 않는 편이 나을지도 모른다."}]);break;
 case "0,3": if(!has("손전등"))return E("계산대에 손전등, 진정제 한 통.",[{t:"둘 다 챙긴다",go:()=>{addItem("손전등");addItem("진정제");return "손전등(관찰 +2)과 진정제를 얻었다."}}]);break;
 case "1,3": if(!f.parkDone)return E(`박 씨가 라디오를 끈다. '여기 사람 아니죠? 그 동굴 열쇠는 내가 갖고 있소.'${f.minaPark?" 미나가 그의 뒤에 숨어 있다.":""}`,[
   {t:"솔직하게 동생 이야기를 한다",ck:["관찰",11],ok:()=>{f.parkDone=1;addItem("동굴 열쇠");return "박 씨가 한숨을 쉰다. '내 아내도 저기 있소.' 열쇠를 건넨다."},no:()=>{f.parkDone=1;return "'단서도 없이 들어가면 죽소.' 그는 열쇠를 주지 않는다."}},
   {t:"그가 한눈판 사이 열쇠를 훔친다",ck:["관찰",12],ok:()=>{f.parkDone=1;f.betray=1;addItem("동굴 열쇠");return "열쇠를 주머니에 넣었다. 박 씨가 라디오를 다시 켠다. 잡음 속에 당신 이름이 섞여 있다."},no:()=>{f.parkDone=1;f.betray=1;return "들켰다. 박 씨가 아무 말 없이 당신을 본다. 그 눈은 구멍 같다."+dmg(0,10)}},
   ...(f.minaPark?[{t:"미나를 데려간다",go:()=>{f.mina=1;f.minaPark=0;return "미나가 박 씨에게 꾸벅 인사하고 당신 손을 잡는다."}}]:[]),
   {t:"나중에 오겠다",go:()=>"박 씨가 라디오를 다시 켠다."}]);break;
 case "3,3": if(!v)return E("방 벽에 수아 키만 한 구멍. 책상 위에 일기장.",[
   {t:"일기를 읽는다",go:()=>"'벽에 내 모양이 생겼어. 밤마다 동굴에서 나를 불러. 오빠한테 말하면 오빠 모양도 생길까 봐 무서워.'"+addClue("diary")+dmg(0,8)},
